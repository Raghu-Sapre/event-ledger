spring:
  application:
    name: gateway-service
  datasource:
    url: jdbc:h2:mem:gateway-db;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  otlp:
    metrics:
      export:
        url: http://otel-collector:4318/v1/metrics
  tracing:
    sampling:
      probability: 1.0

server:
  port: 8080

account-service:
  base-url: http://account-service:8081
