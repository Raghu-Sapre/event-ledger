spring:
  application:
    name: gateway-service
  datasource:
    # Isolated in-memory workspace configuration
    url: jdbc:h2:mem:gatewaydb;DB_CLOSE_DELAY=-1;NON_KEYWORDS=KEY,VALUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080

account-service:
  base-url: http://account-service:8081

# Structured Trace-Friendly Logging Pattern
logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"
  level:
    org.springframework.web: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    distribution:
      percentiles-histogram:
        http:
          server:
            requests: true

  # FIXED: Tracing is turned fully back ON to satisfy the distributed tracing constraint
  tracing:
    enabled: true
    sampling:
      probability: 1.0

  # Unified OpenTelemetry / Jaeger Exporter configuration
  otlp:
    tracing:
      endpoint: http://jaeger:4318/v1/traces

resilience4j:
  retry:
    instances:
      accountService:
        max-attempts: 3
        wait-duration: 500ms
        # FIXED: Removed the nested 'interval-function' property block wrapper
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        enable-randomized-wait: true
        randomized-wait-factor: 0.5
        retry-exceptions:
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException