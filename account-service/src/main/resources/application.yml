spring:
  application:
    name: account-service
  datasource:
    url: jdbc:h2:mem:account-db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

  metrics:
    distribution:
      percentiles-histogram:
        http:
          server:
            requests: true

  tracing:
    sampling:
      probability: 1.0 # Capture 100% of requests for dev/test tracing
    enabled: false

  # Unified OpenTelemetry / Jaeger Exporter configuration
  otlp:
    tracing:
      endpoint: http://jaeger:4318/v1/traces # Streams spans straight to your Jaeger UI container